  // legend and the selected-car chip sit inside the ring, where they never cover the road
  function placeInfield(T) {
    const box = $('#infield'), f = T.infield;
    const canvasTop = $('#ringCanvas').offsetTop, canvasLeft = $('#ringCanvas').offsetLeft;
    box.style.left = (canvasLeft + f.x) + 'px'; box.style.top = (canvasTop + f.y) + 'px';
    box.style.width = Math.max(0, f.w) + 'px'; box.style.height = Math.max(0, f.h) + 'px';
    box.hidden = f.w < 90 || f.h < 16;
    fitInfield();
    const tb = $('#toasts');
    if (f.w >= 300 && f.h >= 120) {
      tb.style.left = (canvasLeft + f.x + f.w / 2) + 'px'; tb.style.top = (canvasTop + f.y + 6) + 'px';
      tb.style.width = Math.min(f.w, 460) + 'px';
    } else { tb.style.left = ''; tb.style.top = ''; tb.style.width = ''; }
  }
  // show the legend only if it fits next to the selected-car chip (measured, not guessed)
  function fitInfield() {
    const box = $('#infield'), lg = $('#legend'), car = $('#hudCarBtn');
    if (box.hidden) return;
    lg.hidden = false;
    const room = box.clientHeight - (car.hidden ? 0 : car.offsetHeight + 8);
    lg.hidden = lg.scrollHeight > room || lg.scrollWidth > box.clientWidth + 1;
  }

  /* ---------------- theme ---------------- */
  function setTheme(v) {
    if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
    Vw.readColors(); markAll();
  }
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = () => { Vw.readColors(); markAll(); };
    if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
  }
  new MutationObserver(() => { Vw.readColors(); markAll(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------------- rendering loop ---------------- */
  let dirty = true, flashUntil = 0;
  function markAll() { dirty = true; if (lab && views.ring) renderHud(); }
  const timers = { teach: 0, car: 0, metrics: 0, charts: 0, st: 0, sound: 0 };
  function renderHud() {
    const pb = $('#btnPlay');
    pb.dataset.running = ui.running ? '1' : '0';
    $('#btnPlayLabel').textContent = ui.running ? '暂停' : (ui.started ? '继续' : '开始');
    const sp = ui.slow ? 0.25 : ui.speed;
    $('#btnSpeedLabel').textContent = (ui.slow ? '慢 ' : '') + sp + '×';
    $('#btnSlow').setAttribute('aria-pressed', ui.slow);
    const hs = $('#hudState');
    const snd = !sound.settings.on ? '' : ' · ' + (sound.targets.mode === 'jam' ? '鸣笛' : '行驶声');
    hs.textContent = sp + '× · ' + (ui.running ? '运行中' : (ui.started ? '已暂停' : '未开始')) + snd;
    hs.dataset.s = ui.running ? 'run' : (ui.started ? 'pause' : 'idle');
    const hc = $('#hudCarBtn');
    const wantCar = ui.selected !== null && ui.selected < lab.sim.N;
    if (hc.hidden === wantCar) { hc.hidden = !wantCar; fitInfield(); }
    if (wantCar) {
      const i = ui.selected, v = lab.sim.V[i], a = lab.sim.Aeff[i];
      $('#hcId').textContent = '车 #' + (i + 1);
      $('#hcV').textContent = ' · ' + Math.round(v * KMH) + ' km/h';
      $('#hcA').textContent = sgn(a, 1) + ' m/s² · 车距 ' + lab.sim.gap(i).toFixed(0) + ' m';
    }
  }
  function renderMetrics() {
    const s = lab.snapshot();
    $('#mSpeed').textContent = Math.round(s.meanV * KMH);
    $('#mDensity').textContent = s.density.toFixed(1);
    $('#mJam').textContent = Math.round(s.jamShare * 100);
    $('#mFlow').textContent = Math.round(s.flow);
    $('#mTime').textContent = s.t < 100 ? s.t.toFixed(1) : Math.round(s.t);
  }

  let lastTs = null, raf = 0;
  function frame(ts) {
    raf = requestAnimationFrame(frame);
    const dt = lastTs === null ? 0 : (ts - lastTs) / 1000;
    lastTs = ts;
    if (ui.running) {
      const n = stepper.take(dt, ui.slow ? 0.25 : ui.speed, 1200);
      if (n > 0) { lab.step(n); dirty = true; }
    }
    const now = ts;
    if (sound.ctx) {
      const mode = sound.targets.mode;
      sound.update(lab, ui.running, ts, ui.slow ? 0.25 : ui.speed);
      views.ring.micPulse = sound.micPulse();
      if (sound.targets.mode !== mode) dirty = true;
      if (now - timers.sound > 400) { syncSoundUi(); timers.sound = now; }
    }
    const animating = ui.running || dirty || now < flashUntil || lab.sim.pertUntil.some(u => u > lab.t);
    if (animating) {
      views.ring.draw(lab, ui);
      if (!$('#stripWrap').hidden) views.strip.draw(lab, ui);
      renderHud();
    }
    if (dirty || now - timers.metrics > 250) { renderMetrics(); timers.metrics = now; }
    const chartsOn = isVisible('charts') || dockOf('charts') === 'B';
    if (chartsOn && (dirty || (ui.running && now - timers.charts > 120) || views.series.cross || views.wave.cross)) {
      if (!$('#chartMainBlock').hidden && $('#chartMainBlock').classList.contains('on')) {
        if (ui.mainKind === 'wave') views.wave.draw(lab); else { views.series.liveRunning = ui.running; views.series.draw(lab); }
      }
      timers.charts = now;
    }
    if (chartsOn && $('#chartStBlock').classList.contains('on') && (dirty || (ui.running && now - timers.st > 300) || views.st.tap)) {
      views.st.draw(lab, ui); timers.st = now;
    }
    if (isVisible('teach') || dockOf('teach') === 'C') {
      if (dirty || now - timers.teach > 500) { if (ui.running || dirty) updateTeach(false); timers.teach = now; }
    }
    if (isVisible('car') && (dirty || now - timers.car > 250)) { if (ui.running || dirty) renderCarPanel(); timers.car = now; }
    if (dirty) syncDocks();
    dirty = false;
  }
  function startLoop() { if (!raf) { lastTs = null; raf = requestAnimationFrame(frame); } }
  function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  // in the background: stop drawing and silence the audio; back in front: continue (audio may need one tap on iOS)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopLoop(); sound.suspend(); } else { stepper.reset(); startLoop(); sound.resumeIfOn(); }
  });
  window.addEventListener('pagehide', () => { stopLoop(); sound.suspend(); });
  window.addEventListener('pageshow', () => { stepper.reset(); startLoop(); sound.resumeIfOn(); });

  let resizeTimer = 0;
  function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { applyLayout(); markAll(); }, 60); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.ResizeObserver) new ResizeObserver(() => markAll()).observe($('#stage'));

  /* ---------------- boot ---------------- */
  // extra canvas for the "wave strength" view lives next to the main chart
  (function addWaveCanvas() {
    const box = $('#chartMain').parentNode;
    const cv = document.createElement('canvas'); cv.id = 'chartWave'; cv.hidden = true; cv.setAttribute('aria-label', '波动强度与流量图');
    box.appendChild(cv);
  })();
  Vw.readColors();
  views.ring = new Vw.RingView($('#ringCanvas'));
  views.ring.onLayout = placeInfield;
  views.strip = new Vw.StripView($('#stripCanvas'));
  views.series = new Vw.SeriesChart($('#chartMain'), $('#chartTip'));
  views.st = new Vw.SpaceTimeChart($('#chartSt'), $('#stTip'));
  views.wave = new Vw.WaveChart($('#chartWave'), $('#chartTip'));
  const savedTheme = store.get('theme'); if (savedTheme) setTheme(savedTheme);
  newLab(Pr.presetParams('free'));
  buildParamsPanel();
  applyLayout(true);
  loadPreset('free');
  const savedChapter = store.get('chapter');
  switchChapter(savedChapter && (Ct.CHAPTERS[savedChapter] || savedChapter === 'quiz') ? savedChapter : 'exp1');
  setChart(ui.chapter === 'exp3' && ui.layout.indexOf('phone') === 0 ? 'st' : 'speed');
  startLoop();

  // a small hook for automated tests (read-only use)
  window.__ptl = { get lab() { return lab; }, ui: ui, act: act, views: views, applyParam: applyParam, loadPreset: loadPreset, layout: () => ui.layout, sound: sound };
})();

</script>
</body>
</html>
