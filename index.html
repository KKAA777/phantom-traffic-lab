<style>
/* standalone file: keep content clear of the top and bottom system bars */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout concept: an instrument stage (the ring road) beside a lab manual;
   on phones the manual becomes a resizable sheet above the thumb-reach control bar. */
:root {
  --bg: #e9edf1;            /* page plane: cool asphalt-tinted gray */
  --surface: #ffffff;       /* panels */
  --surface-2: #f4f6f8;     /* nested blocks */
  --surface-3: #e7ebef;     /* pressed / track */
  --ink: #121820;
  --ink-2: #47515d;
  --muted: #76808c;
  --line: #d7dde4;
  --accent: #1d5fc2;        /* guide-sign blue: interactive controls */
  --accent-2: #e8f0fc;
  --accent-ink: #ffffff;
  --alert: #c2410c;         /* the disturbance button */
  --alert-ink: #ffffff;
  --st-free: #2b9a5e;       /* traffic state: normal */
  --st-slow: #e19b12;       /* clearly slowed */
  --st-jam: #d03b3b;        /* jammed */
  --brake: #ff2d2d;
  --road: #3b4048;
  --road-edge: #f3f3ef;
  --road-mark: #e8c45a;
  --road-bg: #dfe5ea;
  --grid: #e3e7ec;
  --axis: #b4bcc6;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --series-4: #eda100; --series-5: #e87ba4; --series-6: #6250d6;
  --wave: #d03b3b;
  --carflow: #1d5fc2;
  --shadow: 0 1px 2px rgba(18, 24, 32, .06), 0 6px 18px rgba(18, 24, 32, .06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --radius-s: 10px;
  --tap: 44px;
  --sheet-h: 36%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1115; --surface: #151a20; --surface-2: #1b2128; --surface-3: #252c35;
    --ink: #eef2f6; --ink-2: #b4bdc8; --muted: #8592a2; --line: #2b333d;
    --accent: #5c9bf0; --accent-2: #1a2a40; --accent-ink: #0b1220;
    --alert: #f07a3c; --alert-ink: #1a0c04;
    --st-free: #3fb877; --st-slow: #f0b232; --st-jam: #ec5a55; --brake: #ff4d4d;
    --road: #2a2f37; --road-edge: #c9ccd1; --road-mark: #c9a84a; --road-bg: #12171c;
    --grid: #232a33; --axis: #3d4652;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --series-4: #c98500; --series-5: #d55181; --series-6: #9085e9;
    --wave: #ec5a55; --carflow: #5c9bf0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1115; --surface: #151a20; --surface-2: #1b2128; --surface-3: #252c35;
  --ink: #eef2f6; --ink-2: #b4bdc8; --muted: #8592a2; --line: #2b333d;
  --accent: #5c9bf0; --accent-2: #1a2a40; --accent-ink: #0b1220;
  --alert: #f07a3c; --alert-ink: #1a0c04;
  --st-free: #3fb877; --st-slow: #f0b232; --st-jam: #ec5a55; --brake: #ff4d4d;
  --road: #2a2f37; --road-edge: #c9ccd1; --road-mark: #c9a84a; --road-bg: #12171c;
  --grid: #232a33; --axis: #3d4652;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --series-4: #c98500; --series-5: #d55181; --series-6: #9085e9;
  --wave: #ec5a55; --carflow: #5c9bf0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button, [role="tab"], input, label { touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- app grid ---------- */
#app {
  height: 100%; width: 100%;
  display: grid; gap: 0;
  overflow: hidden;
}
/* every full-width band keeps its own side gutter clear of the notch */
.gutter-x, .metrics, .controls, .dock-head, .panel {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app[data-layout="phone-landscape"] .stage { padding-left: env(safe-area-inset-left, 0px); }
.topbar { grid-area: top; min-width: 0; }
.stage { grid-area: stage; min-width: 0; min-height: 0; }
.metrics { grid-area: metrics; min-width: 0; }
.controls { grid-area: controls; min-width: 0; }
.docks { display: contents; }
#dockA { grid-area: dockA; }
#dockB { grid-area: dockB; }
#dockC { grid-area: dockC; }
.dock[data-empty] { display: none !important; }

/* phone, portrait */
#app[data-layout="phone-portrait"] {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(120px, 1fr) auto var(--sheet-h) auto;
  grid-template-areas: "top" "stage" "metrics" "dockA" "controls";
}
#app[data-layout="phone-portrait"] #dockB, #app[data-layout="phone-portrait"] #dockC { display: none; }

/* phone, landscape */
#app[data-layout="phone-landscape"] {
  grid-template-columns: minmax(0, 1fr) minmax(300px, 46%);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "stage top" "stage metrics" "stage dockA" "controls dockA";
}
#app[data-layout="phone-landscape"] #dockB, #app[data-layout="phone-landscape"] #dockC { display: none; }

/* tablet, portrait */
#app[data-layout="tablet-portrait"] {
  grid-template-columns: minmax(0, 1fr) minmax(300px, 40%);
  grid-template-rows: auto minmax(0, 47fr) auto auto minmax(0, 53fr);
  grid-template-areas: "top top" "stage dockA" "controls dockA" "metrics metrics" "dockB dockC";
}

/* tablet / desktop, landscape */
#app[data-layout="tablet-landscape"] {
  grid-template-columns: minmax(272px, 23%) minmax(0, 1fr) minmax(330px, 31%);
  grid-template-rows: auto minmax(0, 55fr) minmax(0, 45fr) auto auto;
  grid-template-areas: "top top top" "dockA stage dockB" "dockA stage dockC" "dockA metrics dockC" "dockA controls dockC";
}

/* ---------- top bar ---------- */
/* phone portrait: [brand ... actions] above a full-width chapter row; other layouts: one row */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 6px;
  padding-top: 8px; padding-bottom: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { flex: 1 1 0; order: 0; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 34px; }
.top-actions { flex: 0 0 auto; order: 2; display: flex; align-items: center; margin: -6px -10px -6px 0; }
.top-actions .icon-btn { margin: 0; }
#btnSound { position: relative; }
#btnSound .snd-on { display: none; }
#btnSound[aria-pressed="true"] { color: var(--accent); }
#btnSound[aria-pressed="true"] .snd-on { display: block; }
#btnSound[aria-pressed="true"] .snd-off { display: none; }
#btnSound .snd-dot { position: absolute; top: 8px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); display: none; }
#btnSound[data-wait="1"] .snd-dot { display: block; animation: snd-wait 1.2s ease-in-out infinite; }
@keyframes snd-wait { 50% { opacity: .3; } }
.brand-mark {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, var(--surface) 0 7px, transparent 7.5px),
    conic-gradient(var(--st-jam) 0 52deg, var(--st-slow) 52deg 96deg, var(--st-free) 96deg 360deg);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.brand-text { flex: 1; min-width: 0; }
.brand h1 { font-size: 17px; line-height: 1.2; font-weight: 700; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-en { font-size: 10.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  flex: 0 0 auto; width: var(--tap); height: var(--tap); margin: -6px -10px -6px 0;
  display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; cursor: pointer; color: var(--ink-2);
}
.icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.icon-btn svg .fill { fill: currentColor; }
.icon-btn:active { background: var(--surface-3); }
.chapters {
  flex: 1 0 100%; order: 3;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px;
  scroll-snap-type: x proximity;
}
.chapters::-webkit-scrollbar { display: none; }
.chapters button {
  flex: 0 0 auto; min-height: var(--tap); padding: 4px 13px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  display: inline-flex; align-items: baseline; gap: 6px; scroll-snap-align: start; white-space: nowrap;
}
.chapters .chap-no { font-weight: 700; font-size: 13.5px; }
.chapters .chap-name { font-size: 12.5px; }
.chapters button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#app[data-layout^="phone"] .chapters .chap-name { display: none; }
#app[data-layout="phone-portrait"] .brand-en { display: none; }
/* phone landscape: chapters and the sound switch share one row (the model notes stay reachable in portrait) */
#app[data-layout="phone-landscape"] .topbar { padding-top: 6px; padding-bottom: 6px; }
#app[data-layout="phone-landscape"] .brand, #app[data-layout="phone-landscape"] #btnNotes { display: none; }
#app[data-layout="phone-landscape"] .chapters { flex: 1 1 0; order: 1; min-width: 0; }
#app[data-layout="phone-landscape"] .chapters button { padding: 4px 10px; }
#app[data-layout^="tablet"] .topbar { flex-wrap: nowrap; column-gap: 18px; }
#app[data-layout^="tablet"] .brand { flex: 0 1 auto; }
#app[data-layout^="tablet"] .chapters { flex: 1 1 auto; order: 1; min-width: 0; justify-content: flex-end; }
#app[data-layout^="tablet"] .top-actions { margin-left: -8px; }
#app[data-layout="tablet-portrait"] .chapters .chap-name { display: none; }
@media (max-width: 1299px) { #app[data-layout^="tablet"] .brand-en { display: none; } }

/* ---------- stage ---------- */
.stage { position: relative; background: var(--road-bg); overflow: hidden; display: flex; flex-direction: column; }
#ringCanvas { flex: 1 1 auto; min-height: 0; width: 100%; display: block; touch-action: manipulation; cursor: pointer; }
.strip-wrap { flex: 0 0 auto; height: 74px; border-top: 1px solid var(--line); background: var(--surface-2); position: relative; }
.strip-wrap[hidden] { display: none; }
#stripCanvas { width: 100%; height: 100%; display: block; }
.stage-hud { position: absolute; display: flex; gap: 6px; pointer-events: none; z-index: 2; }
.stage-hud-top { top: 5px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); justify-content: space-between; align-items: center; }
.infield { position: absolute; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
.infield .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; font-size: 11px; line-height: 1.5; color: var(--ink-2); max-width: 100%; }
.infield .legend[hidden] { display: none; }
.infield .hud-car { pointer-events: auto; }
.hud-chip {
  font-size: 12px; line-height: 1; padding: 6px 9px; max-width: 48vw; overflow: hidden; text-overflow: ellipsis; border-radius: 999px;
  background: var(--surface); background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink-2);
  box-shadow: 0 0 0 1px var(--line); white-space: nowrap;
}
.hud-state[data-s="run"] { color: var(--st-free); }
.hud-state[data-s="pause"] { color: var(--st-slow); }
.hud-car {
  min-height: var(--tap); padding: 6px 12px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--line);
  font-size: 12.5px; line-height: 1.35; text-align: left; font-variant-numeric: tabular-nums;
}
.hud-car b { font-size: 13.5px; }
.lg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.lg .line { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.st-free { background: var(--st-free); } .st-slow { background: var(--st-slow); } .st-jam { background: var(--st-jam); }
.lg .dot.brake { background: var(--brake); border-radius: 50%; }
.lg .arrow { width: 18px; height: 10px; display: inline-block; position: relative; }
.lg .arrow::before { content: ""; position: absolute; left: 0; right: 4px; top: 4px; height: 2px; background: currentColor; }
.lg .arrow::after { content: ""; position: absolute; right: 0; top: 1px; border: 4px solid transparent; border-left: 6px solid currentColor; border-right: 0; }
.lg .arrow.car { color: var(--carflow); } .lg .arrow.wave { color: var(--wave); transform: scaleX(-1); }

.toasts { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: min(calc(100% - 32px), 460px); z-index: 4; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast {
  pointer-events: auto; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 7px 11px;
  box-shadow: var(--shadow), 0 0 0 1px var(--line); font-size: 12.5px; line-height: 1.45;
  display: flex; gap: 8px; align-items: flex-start; animation: toast-in .25s ease-out;
}
.toast i { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--accent); }
.toast[data-tone="warn"] i { background: var(--st-slow); } .toast[data-tone="jam"] i { background: var(--st-jam); } .toast[data-tone="good"] i { background: var(--st-free); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
#app[data-layout^="phone"] .toast + .toast { display: none; }

/* ---------- metrics ---------- */
.metrics {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: var(--surface);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.metric { padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.metric + .metric { box-shadow: inset 1px 0 0 var(--line); }
.metric:first-child { padding-left: 0; }
.m-label { font-size: 11px; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.m-value { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
.m-value b { font: 650 19px/1.15 var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); }
.m-value small { font-size: 10.5px; color: var(--muted); }
#app[data-layout="phone-portrait"] .metrics, #app[data-layout="phone-landscape"] .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
#app[data-layout="phone-portrait"] .m-flow, #app[data-layout="phone-landscape"] .m-flow { display: none; }
#app[data-layout="phone-portrait"] .metric { padding: 4px 8px 5px; }
#app[data-layout="phone-portrait"] .m-value b, #app[data-layout="phone-landscape"] .m-value b { font-size: 16px; }
#app[data-layout="phone-landscape"] .metric { padding: 3px 8px 4px; }

/* ---------- control bar ---------- */
.controls {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;
  padding-top: 6px; padding-bottom: 6px;
  background: var(--surface); border-top: 1px solid var(--line);
}
.ctl {
  min-height: 52px; min-width: var(--tap); border-radius: 12px; border: 0; cursor: pointer;
  background: var(--surface-2); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11.5px; line-height: 1.1; padding: 4px 2px; user-select: none; -webkit-user-select: none;
}
.ctl svg { width: 22px; height: 22px; fill: currentColor; }
.ctl svg .stroke { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ctl:active { transform: scale(.97); background: var(--surface-3); }
.ctl[disabled] { opacity: .45; }
.ctl[aria-pressed="true"] { background: var(--accent-2); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.ctl-primary { background: var(--accent); color: var(--accent-ink); }
.ctl-primary:active { background: var(--accent); filter: brightness(.95); }
.ctl-alert { background: var(--alert); color: var(--alert-ink); }
.ctl-alert:active { background: var(--alert); filter: brightness(.95); }
.ctl-alert svg .inv { stroke: var(--alert); fill: none; stroke-width: 2.2; stroke-linecap: round; }
.ctl-alert svg .inv-fill { fill: var(--alert); }
.ctl .ico-pause { display: none; }
.ctl[data-running="1"] .ico-play { display: none; }
.ctl[data-running="1"] .ico-pause { display: block; }
#app[data-layout="phone-landscape"] .controls { padding-top: 4px; padding-bottom: 4px; gap: 4px; }
#app[data-layout="phone-landscape"] .ctl { min-height: 46px; font-size: 10.5px; }
#app[data-layout="tablet-landscape"] .controls { border-top: 0; }

/* ---------- docks & panels ---------- */
.dock { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
#app[data-layout="tablet-landscape"] #dockA { border-right: 1px solid var(--line); }

  flex: 0 0 auto; min-height: var(--tap); padding: 0 13px; border: 0; background: transparent; cursor: pointer;

/* ---------- teaching panel ---------- */
.chap-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }

}

.btn {
  min-height: var(--tap); padding: 0 14px; border-radius: 11px; border: 0; cursor: pointer; white-space: nowrap;
  background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.soft { background: var(--accent-2); color: var(--accent); }
.btn.alert { background: var(--alert); color: var(--alert-ink); }
.btn.small { min-height: var(--tap); padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn:active { filter: brightness(.94); }

.layer { border-top: 1px solid var(--line); padding: 12px 0 14px; }

.layer > summary::after { content: ""; margin-left: auto; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
.layer[open] > summary::after { transform: rotate(225deg); }
.layer-no { font: 700 11px/1 var(--font); letter-spacing: .1em; color: var(--accent); background: var(--accent-2); padding: 5px 7px; border-radius: 5px; white-space: nowrap; }
.layer h3 { font-size: 16px; }
.layer-body { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; font-size: 14.5px; line-height: 1.7; }
.layer-body p, .layer-body li { max-width: 66ch; }
.layer-body ul, .layer-body ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 6px; }
.q { font-weight: 700; color: var(--ink); }
.qa { display: flex; flex-direction: column; gap: 4px; }
.qa + .qa { padding-top: 6px; }
.live { background: var(--surface-2); border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; line-height: 1.65; }
.live.empty { color: var(--muted); }

.v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; vertical-align: 1.5px; margin-right: 4px; white-space: nowrap; }
.tag.obs { color: var(--st-free); box-shadow: inset 0 0 0 1px var(--st-free); }
.tag.mod { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tag.thy { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ink-2); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 10px; border-radius: 999px; font-size: 13px; }
.verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.verdict.neutral { color: var(--ink-2); background: var(--surface-3); }
.term { border-radius: var(--radius-s); padding: 10px 12px; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 13.5px; }
.term b { color: var(--accent); }
.tryrow { display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); border-radius: var(--radius-s); padding: 10px 12px; }
.tryrow .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.tryrow .proves { font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.focus-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-btn {
  min-height: var(--tap); min-width: var(--tap); padding: 0 12px; border-radius: 999px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); display: inline-flex; align-items: center; gap: 6px;
}
.chip-btn[aria-pressed="true"] { background: var(--accent-2); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip-btn .key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.stepcard { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.stepcard:last-child { border-bottom: 0; }
.stepcard .no { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-2); color: var(--accent); display: grid; place-items: center; font: 700 13px/1 var(--font-num); }

/* ---------- charts ---------- */
.chart-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: 10px; }
.chart-tabs::-webkit-scrollbar { display: none; }
.chart-tabs button {
  flex: 0 0 auto; min-height: var(--tap); padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; font-size: 13.5px;

}
.chart-tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); box-shadow: none; }
.chart-block.on + .chart-block.on { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
#app[data-layout^="phone"] #chartStBlock .chart-sub { display: none; }
#app[data-layout^="phone"] .st-legend { font-size: 11.5px; gap: 2px 10px; }
.chart-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.chart-head h3 { font-size: 14.5px; }
.chart-sub { font-size: 12px; color: var(--muted); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.chart-legend .lg .line { height: 2.5px; }
#panelCharts.on { display: flex; flex-direction: column; min-height: 100%; }
.chart-block { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.chart-box { position: relative; flex: 1 1 auto; min-height: 170px; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
#app[data-layout^="tablet"] .chart-box { min-height: 130px; }
#app[data-layout="phone-landscape"] .chart-box { min-height: 130px; }
#app[data-layout="phone-landscape"] .chart-sub, #app[data-layout="phone-landscape"] .chart-head h3 { display: none; }
#app[data-layout="phone-landscape"] .chart-tabs { margin-bottom: 6px; }
#app[data-layout^="tablet"] .chart-sub { display: none; }
.chart-tip {
  position: absolute; top: 6px; pointer-events: none; z-index: 2; min-width: 120px; max-width: 70%;
  background: var(--surface); color: var(--ink); border-radius: 10px; padding: 7px 9px; font-size: 12px; line-height: 1.5;
  box-shadow: var(--shadow), 0 0 0 1px var(--line); font-variant-numeric: tabular-nums;
}
.chart-tip .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.chart-tip .row i { width: 12px; height: 2.5px; border-radius: 2px; display: inline-block; }
.chart-tip .row b { font-weight: 650; }
.chart-tip .t { color: var(--muted); margin-bottom: 2px; }
#chartStBlock:not(.on), #chartMainBlock:not(.on) { display: none; }
#app[data-layout^="tablet"] .chart-tabs .tab-st { display: none; }

/* ---------- parameters ---------- */
.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.preset {
  min-height: 58px; border-radius: 12px; border: 0; cursor: pointer; text-align: left; padding: 8px 10px;
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 2px;
}
.preset b { font-size: 14px; }
.preset small { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.preset[aria-pressed="true"] { background: var(--accent-2); box-shadow: inset 0 0 0 2px var(--accent); }
.preset[aria-pressed="true"] b { color: var(--accent); }
.param-group h4 { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin: 14px 0 4px; font-weight: 700; }
.param { padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
.param:last-child { border-bottom: 0; }
.p-top { display: flex; align-items: baseline; gap: 8px; }
.p-top label { font-weight: 650; font-size: 14px; }
.p-top .p-val { margin-left: auto; font: 650 15px/1 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.p-top .p-val small { font: 12px var(--font); color: var(--muted); margin-left: 2px; }
.p-desc { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
.p-ctl { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); gap: 6px; align-items: center; margin-top: 4px; }
.p-step {
  height: var(--tap); width: var(--tap); border-radius: 10px; border: 0; cursor: pointer; font-size: 20px; line-height: 1;
  background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
}
.p-step:active { background: var(--surface-3); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: var(--tap); background: transparent; margin: 0; cursor: pointer;
  touch-action: pan-y;
}
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 var(--fill, 50%), var(--surface-3) var(--fill, 50%)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; margin-top: -11px;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.08);
}
input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.param.resets .p-top label::after { content: "改变后重新开始"; font-size: 10.5px; font-weight: 600; color: var(--alert); margin-left: 6px; padding: 1px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--alert); vertical-align: 1px; }
.derived { background: var(--surface-2); border-radius: var(--radius-s); padding: 10px 12px; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.derived .row { display: flex; justify-content: space-between; gap: 10px; }
.derived .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: var(--tap); cursor: pointer; }
.switch-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
.switch-row select { min-height: var(--tap); font: inherit; font-size: 14px; border-radius: 9px; padding: 0 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); min-width: 0; max-width: 62%; }
.sound-now { font-size: 13px; line-height: 1.55; background: var(--surface-2); border-radius: var(--radius-s); padding: 8px 10px; margin: 2px 0 4px; color: var(--ink-2); }
.sound-now b { color: var(--ink); font-weight: 650; }
.sound-group .hint { margin-top: 8px; }

/* ---------- car panel ---------- */
.car-empty { color: var(--muted); font-size: 14px; background: var(--surface-2); border-radius: var(--radius-s); padding: 12px; }
.car-card { display: flex; flex-direction: column; gap: 10px; }
.car-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.kv b { font: 650 17px/1.3 var(--font-num); font-variant-numeric: tabular-nums; }
.kv b small { font: 11.5px var(--font); color: var(--muted); margin-left: 2px; }
.decomp { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.dbar { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.6em; gap: 8px; align-items: center; }
.dbar .track { height: 10px; position: relative; background: var(--surface-3); border-radius: 5px; }
.dbar .track i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.dbar .track .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--axis); }
.dbar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.cause { font-size: 14px; line-height: 1.7; }
.car-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.table-wrap { overflow-x: auto; margin: 6px -4px 0; padding: 0 4px; -webkit-overflow-scrolling: touch; }
table.pt { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.pt th, table.pt td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.pt th:first-child, table.pt td:first-child { text-align: left; }
table.pt th { font-size: 11.5px; color: var(--muted); font-weight: 600; }
table.pt td .key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.section-title { font-size: 15px; margin: 18px 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.55; }

/* ---------- challenge ---------- */
.quiz-list { display: flex; flex-direction: column; gap: 14px; }
.quiz { border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.quiz.solved { box-shadow: inset 0 0 0 1.5px var(--st-free); }
.quiz h3 { font-size: 15.5px; line-height: 1.45; display: flex; gap: 8px; }
.quiz h3 .qn { flex: 0 0 auto; font: 700 12px/1 var(--font-num); color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 5px 6px; height: fit-content; margin-top: 1px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); cursor: pointer; min-height: var(--tap); font-size: 14px; line-height: 1.5; }
.opt input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
.opt:has(input:checked) { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-2); }
.opt.correct { box-shadow: inset 0 0 0 1.5px var(--st-free); }
.opt.wrong { box-shadow: inset 0 0 0 1.5px var(--st-jam); }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.result { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mini { background: var(--surface-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mini canvas { width: 100%; height: 96px; display: block; border-radius: 6px; }
.mini h5 { margin: 0; font-size: 13px; }
.mini .stats { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.mini .btn { align-self: flex-start; }
.busy { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.busy::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.score { font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 16, .45); display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--surface); width: min(760px, 100%); max-height: 100%; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 10px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 18px; }
.modal-body { overflow-y: auto; padding: 14px 18px 22px; font-size: 14.5px; line-height: 1.7; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.modal-body h3 { font-size: 15.5px; margin: 18px 0 6px; }
.modal-body h3:first-child { margin-top: 0; }
.modal-body p, .modal-body li { max-width: 68ch; }
.modal-body ul { padding-left: 1.2em; margin: 6px 0; }
.formula { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; line-height: 1.6; }
.modal-body table { border-collapse: collapse; font-size: 13px; width: 100%; }
.modal-body td, .modal-body th { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; }
.modal-body .table-wrap table { min-width: 520px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  <header class="topbar" id="topbar">

        <p class="brand-en">Phantom Traffic Jam · Interactive Physics Lab</p>

<script>
/* ---- sim.js ---- */
/* =====================================================================
 * Phantom Traffic Lab — simulation core (no DOM; also runs in Node)
 *
 * Model: Intelligent Driver Model (IDM)
 *   Treiber, Hennecke & Helbing, Phys. Rev. E 62, 1805 (2000)
 *   dv/dt = a [ 1 - (v/v0)^delta - (s*(v,dv)/s)^2 ]
 *   s*(v,dv) = s0 + max(0, v T + v dv / (2 sqrt(a b)))
 *   s  = bumper-to-bumper gap to the leader, dv = v - v_leader (approach rate)
 *
 * Road: one closed lane of length L (ring), no overtaking.
 *   Car i follows car i-1; car 0 follows car N-1 one lap ahead (+L).
 *
 * Extensions beyond the standard IDM (all documented in the app):
 *   1. Reaction time tau: the acceleration applied at time t is computed from
 *      the state the driver perceived at t - tau (own speed, leader speed, gap),
 *      read from a per-car history buffer with linear interpolation.
 *   2. Braking is capped at the physical limit bMax.
 *   3. Last-resort non-penetration constraint (gap >= 0.5 m). Every activation
 *      is counted and surfaced; it never activates in the presets.
 *   4. Optional coloured acceleration noise (Ornstein-Uhlenbeck), off by default.
 *
 * Integration: ballistic update with a fixed step (Treiber & Kanagaraj 2015),
 * so results do not depend on the display frame rate.
 * ===================================================================== */
(function (root) {
  'use strict';

  const DT = 0.05;            // default fixed integration step [s]
  const TAU_MAX = 1.5;        // longest reaction time the history supports [s]
  const MIN_GAP_HARD = 0.5;   // [m] last-resort constraint
  const NOISE_TC = 2.0;       // correlation time of the optional noise [s]

  // "Normal driver" values used by the presets (calibrated in tests/model.test.mjs).
  const DEFAULTS = {
    N: 60,            // number of cars
    L: 1500,          // ring length [m]
    v0: 120 / 3.6,    // desired speed [m/s]
    T: 1.2,           // desired time gap [s]
    a: 1.0,           // maximum acceleration [m/s^2]
    b: 3.0,           // comfortable deceleration [m/s^2]
    tau: 0.4,         // reaction time [s]
    s0: 2.0,          // minimum standstill gap [m] (fixed)
    delta: 4,         // acceleration exponent (fixed)
    len: 5.0,         // car length [m] (fixed)
    bMax: 9.0,        // physical braking limit [m/s^2] (fixed)
    pertDecel: 1.0,   // disturbance: forced deceleration [m/s^2]
    pertDur: 5.0,     // disturbance: duration [s]
    noise: 0.0,       // optional acceleration noise amplitude [m/s^2]
    hetero: 0.0,      // spread of the drivers' own parameters around the means (0 = identical drivers)
    seed: 20080301
  };

  /* ---------- IDM building blocks ---------- */

  function desiredGap(v, dv, p) {
    const dyn = v * p.T + (v * dv) / (2 * Math.sqrt(p.a * p.b));
    return p.s0 + (dyn > 0 ? dyn : 0);
  }

  // Returns the two IDM terms separately (used by the explanations).
  function idmTerms(s, v, dv, p) {
    const sStar = desiredGap(v, dv, p);
    const sEff = s > 0.05 ? s : 0.05;
    const free = p.a * (1 - Math.pow(Math.max(v, 0) / p.v0, p.delta));
    const inter = -p.a * (sStar / sEff) * (sStar / sEff);
    return { free: free, inter: inter, acc: free + inter, sStar: sStar };
  }

  function idmAcc(s, v, dv, p) {
    const sStar = desiredGap(v, dv, p);
    const sEff = s > 0.05 ? s : 0.05;
    const r = sStar / sEff;
    return p.a * (1 - Math.pow(Math.max(v, 0) / p.v0, p.delta) - r * r);
  }

  // Equilibrium gap for a given speed: s_e(v) = s*(v,0) / sqrt(1 - (v/v0)^delta)
  function equilibriumGap(v, p) {
    const q = 1 - Math.pow(v / p.v0, p.delta);
    if (q <= 0) return Infinity;
    return (p.s0 + v * p.T) / Math.sqrt(q);
  }

  // Speed at which uniform traffic with the given gap is steady (bisection).
  function equilibriumSpeed(gap, p) {
    if (gap <= p.s0) return 0;
    let lo = 0, hi = p.v0;
    for (let k = 0; k < 80; k++) {
      const mid = 0.5 * (lo + hi);
      if (equilibriumGap(mid, p) > gap) hi = mid; else lo = mid;
    }
    return 0.5 * (lo + hi);
  }

  /* Linear (small-perturbation) analysis of uniform flow at the given gap.
   * Follower response to its leader's speed: G(p) = (A + pC) / (p^2 e^{p tau} - pB + A)
   *   A = df/ds, B = df/dv (s, v_l fixed), C = df/dv_l, all at equilibrium.
   * |G(i w)| > 1 for some w  <=>  the platoon amplifies waves of that frequency
   * (string instability). For tau = 0 the long-wave limit gives the classic
   * criterion A < F^2/2 - C F with F = B + C.                                  */
  function linearStability(gap, p) {
    const v = equilibriumSpeed(gap, p);
    const hs = 1e-4 * Math.max(1, gap), hv = 1e-4 * Math.max(1, v + 1);
    const f = (s, vv, vl) => idmAcc(s, vv, vv - vl, p);
    const A = (f(gap + hs, v, v) - f(gap - hs, v, v)) / (2 * hs);
    const B = (f(gap, v + hv, v) - f(gap, v - hv, v)) / (2 * hv);
    const C = (f(gap, v, v + hv) - f(gap, v, v - hv)) / (2 * hv);
    const tau = Math.max(0, Math.min(p.tau || 0, TAU_MAX));
    let gMax = 0, wMax = 0;
    // log-spaced frequency scan 1e-3 .. 6 rad/s
    const n = 1600;
    for (let k = 0; k <= n; k++) {
      const w = Math.pow(10, -3 + (k / n) * Math.log10(6000));
      const reD = A - w * w * Math.cos(w * tau);
      const imD = -w * w * Math.sin(w * tau) - w * B;
      const g = Math.sqrt((A * A + w * w * C * C) / (reD * reD + imD * imD));
      if (g > gMax) { gMax = g; wMax = w; }
    }
    const F = B + C;
    return {
      vEq: v, gap: gap, A: A, B: B, C: C,
      gMax: gMax, wMax: wMax,
      period: wMax > 0 ? 2 * Math.PI / wMax : Infinity,
      longWaveMargin: F * F / 2 - C * F - A,   // > 0 means long waves are damped (tau = 0 theory)
      stable: gMax <= 1 + 1e-4
    };
  }

  /* ---------- deterministic RNG for the optional noise ---------- */
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- the ring-road simulation ---------- */
  class RingSim {
    constructor(params, options) {
      this.p = Object.assign({}, DEFAULTS, params || {});
      this.dt = (options && options.dt) || DT;
      this.reset();
    }

    // Change parameters. N and L change the road itself, so they force a reset.
    setParams(changes) {
      let structural = false;
      for (const k in changes) {
        if (!Object.prototype.hasOwnProperty.call(changes, k)) continue;
        if ((k === 'N' || k === 'L' || k === 'hetero') && changes[k] !== this.p[k]) structural = true;
        this.p[k] = changes[k];
      }
      if (this.p.tau > TAU_MAX) this.p.tau = TAU_MAX;
      if (this.p.tau < 0) this.p.tau = 0;
      if (structural) this.reset(); else this.applyDrivers();
      return structural;
    }

    reset() {
      const p = this.p;
      const N = Math.max(2, Math.round(p.N));
      const L = p.L;
      this.N = N; this.L = L;
      this.hist = Math.round(TAU_MAX / this.dt) + 4;
      this.X = new Float64Array(N);     // odometer position (unwrapped) [m]
      this.V = new Float64Array(N);     // speed [m/s]
      this.A = new Float64Array(N);     // commanded acceleration of last step [m/s^2]
      this.Aeff = new Float64Array(N);  // realised acceleration of last step [m/s^2]
      this.Xn = new Float64Array(N);
      this.Vn = new Float64Array(N);
      this.pertUntil = new Float64Array(N).fill(-1);
      this.pertStart = new Float64Array(N).fill(-1);
      this.pertDecel = new Float64Array(N);
      this.xi = new Float64Array(N);    // noise state
      this.hX = new Float64Array(this.hist * N);
      this.hV = new Float64Array(this.hist * N);
      this.head = 0;
      this.steps = 0;
      this.t = 0;
      this.constraintHits = 0;
      this.lastConstraint = null;
      this.rng = mulberry32(p.seed);
      this.spareGauss = null;

      // Each driver has their own parameters: mean value x (1 + hetero * u), u fixed per car in [-1, 1].
      const drng = mulberry32((p.seed ^ 0x9e3779b9) >>> 0);
      this.U = {};
      for (const key of ['v0', 'T', 'a', 'b', 'tau']) {
        const u = new Float64Array(N);
        for (let i = 0; i < N; i++) u[i] = 2 * drng() - 1;
        this.U[key] = u;
      }
      this.dv0 = new Float64Array(N); this.dT = new Float64Array(N);
      this.da = new Float64Array(N); this.db = new Float64Array(N); this.dtau = new Float64Array(N);
      this.applyDrivers();

      // steady state: every car at the same speed, each at its own equilibrium gap
      const ve = this.eq.v;
      this.vInit = ve;
      let x = 0;
      this.X[N - 1] = 0;
      for (let i = N - 1; i > 0; i--) { x += this.eqGap(i, ve) + p.len; this.X[i - 1] = x; }
      if (!(p.hetero > 0)) for (let i = 0; i < N; i++) this.X[i] = (N - 1 - i) * (L / N);
      for (let i = 0; i < N; i++) this.V[i] = ve;
      // History as if every car had been cruising steadily before t = 0.
      const H = this.hist;
      for (let k = 0; k < H; k++) {
        const slot = ((this.head - k) % H + H) % H;
        for (let i = 0; i < N; i++) {
          this.hX[slot * N + i] = this.X[i] - ve * k * this.dt;
          this.hV[slot * N + i] = ve;
        }
      }
    }

    // Per-driver parameters from the means and the fixed per-car offsets.
    applyDrivers() {
      const p = this.p, N = this.N, h = Math.max(0, Math.min(0.5, p.hetero || 0)), U = this.U;
      for (let i = 0; i < N; i++) {
        this.dv0[i] = p.v0 * (1 + h * U.v0[i]);
        this.dT[i] = p.T * (1 + h * U.T[i]);
        this.da[i] = p.a * (1 + h * U.a[i]);
        this.db[i] = p.b * (1 + h * U.b[i]);
        this.dtau[i] = Math.min(TAU_MAX, Math.max(0, p.tau * (1 + h * U.tau[i])));
      }
      this.eq = this.solveEquilibrium();
    }

    driver(i) {
      return Object.assign({}, this.p, { v0: this.dv0[i], T: this.dT[i], a: this.da[i], b: this.db[i], tau: this.dtau[i] });
    }

    eqGap(i, v) {
      const p = this.p;
      const q = 1 - Math.pow(v / this.dv0[i], p.delta);
      return q <= 0 ? Infinity : (p.s0 + v * this.dT[i]) / Math.sqrt(q);
    }

    // Common speed at which the whole ring can cruise steadily (identical drivers: the usual IDM equilibrium).
    solveEquilibrium() {
      const p = this.p, N = this.N, free = this.L - N * p.len;
      if (!(p.hetero > 0)) { const g = this.L / N - p.len; return { gap: g, v: equilibriumSpeed(g, p) }; }
      let vmax = Infinity;
      for (let i = 0; i < N; i++) vmax = Math.min(vmax, this.dv0[i]);
      let lo = 0, hi = vmax;
      if (N * p.s0 >= free) return { gap: free / N, v: 0 };
      for (let k = 0; k < 80; k++) {
        const mid = 0.5 * (lo + hi);
        let sum = 0;
        for (let i = 0; i < N; i++) sum += this.eqGap(i, mid);
        if (sum > free) hi = mid; else lo = mid;
      }
      return { gap: free / N, v: 0.5 * (lo + hi) };
    }

    gauss() {
      if (this.spareGauss !== null) { const g = this.spareGauss; this.spareGauss = null; return g; }
      let u = 0, v = 0;
      while (u <= 1e-12) u = this.rng();
      v = this.rng();
      const r = Math.sqrt(-2 * Math.log(u));
      this.spareGauss = r * Math.sin(2 * Math.PI * v);
      return r * Math.cos(2 * Math.PI * v);
    }

    leaderOf(i) { return i === 0 ? this.N - 1 : i - 1; }
    followerOf(i) { return i === this.N - 1 ? 0 : i + 1; }

    // Current bumper-to-bumper gap of car i to its leader.
    gap(i) {
      const j = this.leaderOf(i);
      return this.X[j] + (i === 0 ? this.L : 0) - this.X[i] - this.p.len;
    }

    // Position along the ring in [0, L)
    pos(i) {
      const x = this.X[i] % this.L;
      return x < 0 ? x + this.L : x;
    }

    // What driver i perceives now (state at t - tau): used for the model and the explanations.
    perceived(i) {
      const p = this.p, N = this.N, H = this.hist;
      const j = this.leaderOf(i), off = i === 0 ? this.L : 0;
      const kd = this.dtau[i] / this.dt;
      const k0 = Math.floor(kd + 1e-9);
      const fr = kd - k0 > 1e-9 ? kd - k0 : 0;
      const s0i = ((this.head - k0) % H + H) % H;
      const s1i = ((this.head - k0 - 1) % H + H) % H;
      const b0 = s0i * N, b1 = s1i * N;

      }
      const cars = pl.cars, dips = pl.dips();
      let w = tag.obs + id(cars[0].idx) + '（扰动车）最低降到 ' + kmh(cars[0].vMin) + '，降了 ' + dkmh(dips[0]) + '。后面 ' + (cars.length - 1) + ' 辆车依次降了：';

              (c.gapMin < want ? '少了 ' + mtr(want - c.gapMin) : '多不了多少') + '。要把这段距离补回来，它只能在一段时间里开得比前车更慢——于是它的最低点更低。';

        c.beginPath(); c.moveTo(-5.5, -2); c.lineTo(-3, -2); c.lineTo(0.5, -5); c.lineTo(0.5, 5); c.lineTo(-3, 2); c.lineTo(-5.5, 2); c.closePath(); c.fill();

        c.beginPath(); c.arc(1.2, 0, 3.2, -0.85, 0.85); c.stroke();
        c.globalAlpha = 0.35 + 0.65 * g; c.beginPath(); c.arc(1.2, 0, 5.8, -0.85, 0.85); c.stroke();
        c.restore();
      }
      // jam zones under the cars
      const jams = lab.jams.clusters || [];
      if (jams.length) {
        c.strokeStyle = C.jam; c.globalAlpha = 0.22; c.lineWidth = T.rw + 10; c.lineCap = 'butt';
        for (const j of jams) {
          let a0 = j.tail, a1 = j.front; if (a1 < a0) a1 += L;
          c.beginPath();
          const n = Math.max(2, Math.ceil((a1 - a0) * k / 4));
          for (let q = 0; q <= n; q++) { const p = T.at((a0 + (a1 - a0) * q / n) * k, 0); if (q === 0) c.moveTo(p.x, p.y); else c.lineTo(p.x, p.y); }
          c.stroke();
        }
        c.globalAlpha = 1;
      }
      // cars
      const carLen = sim.p.len * k;
      const asDot = carLen < 7;
      const wid = Math.min(T.rw * 0.62, asDot ? 7 : Math.max(5.5, carLen * 0.48));
      const len = Math.max(asDot ? 7 : carLen, 4);
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 160);
      this.carXY.length = N;
      for (let i = 0; i < N; i++) {
        const s = sim.pos(i) * k;
        const p = T.at(s, 0);
        this.carXY[i] = p;
        const cls = An.classify(sim.V[i], vEq);
        if (sim.isPerturbed(i)) {
          c.fillStyle = C.alert; c.globalAlpha = 0.25 + 0.35 * pulse;
          c.beginPath(); c.arc(p.x, p.y, wid + 6, 0, TAU); c.fill(); c.globalAlpha = 1;
        }
        c.save();
        c.translate(p.x, p.y); c.rotate(p.ang);
        c.fillStyle = C.state[cls];
        if (asDot) { roundRect(c, -len / 2, -wid / 2, len, wid, wid / 2); }
        else { roundRect(c, -len / 2, -wid / 2, len, wid, Math.min(3, wid / 2.5)); }
        c.fill();
        if (sim.Aeff[i] < -0.8 && sim.V[i] > 0.3) {
          c.fillStyle = C.brake;
          c.globalAlpha = 0.35; c.beginPath(); c.arc(-len / 2 - 1, 0, 4.2, 0, TAU); c.fill();
          c.globalAlpha = 1; c.beginPath(); c.arc(-len / 2 - 0.5, 0, 2.1, 0, TAU); c.fill();
        }
        c.restore();
      }
      // tracked platoon: a ring in the car's chart colour, so road and charts match
      const plat = lab.platoonCars;
      const ringR = Math.max(len, wid) / 2 + 3;
      for (let q = 0; q < plat.length; q++) {
        const i = plat[q], p = this.carXY[i];
        if (!p) continue;
        c.strokeStyle = C.series[q % 6]; c.lineWidth = 2.2;
        c.beginPath(); c.arc(p.x, p.y, ringR, 0, TAU); c.stroke();
        if (this.labelPlatoon || q === 0) {
          const lp = T.at(sim.pos(i) * k, -T.rw / 2 - (q % 2 ? 30 : 16));
          label(c, '#' + (i + 1), lp.x, lp.y, { size: 10, bg: C.surface, color: C.ink, ring: C.series[q % 6], padX: 4 });
        }
      }
      // selected car
      if (ui.selected !== null && ui.selected < N) {
        const i = ui.selected, p = this.carXY[i];
        c.strokeStyle = C.ink; c.lineWidth = 2;
        c.beginPath(); c.arc(p.x, p.y, Math.max(len, wid) / 2 + 5, 0, TAU); c.stroke();
        const lp = T.at(sim.pos(i) * k, T.rw / 2 + 22);
        label(c, '#' + (i + 1) + ' · ' + Math.round(sim.V[i] * KMH) + ' km/h', lp.x, lp.y, { size: 11, bg: C.ink, color: C.surface, padX: 6 });
      }
      // a car named in an explanation (e.g. on pause) pulses briefly
      if (this.flash && this.flash.until > performance.now() && this.flash.car < N) {
        const p = this.carXY[this.flash.car];
        c.strokeStyle = C.accent; c.lineWidth = 2.5; c.globalAlpha = 0.5 + 0.5 * pulse;
        c.beginPath(); c.arc(p.x, p.y, Math.max(len, wid) / 2 + 9, 0, TAU); c.stroke(); c.globalAlpha = 1;
      }
      // propagation arrows
      this.selectedPos = ui.selected !== null && ui.selected < N ? sim.pos(ui.selected) : null;
      if (this.showWave && lab.jams.main) this.drawWaveArrows(c, lab, k);
    }

    drawWaveArrows(c, lab, k) {
      const T = this.track, sim = lab.sim, L = sim.L, main = lab.jams.main;
      const w = lab.jams.waveSpeed(main, 20);
      if (w === null) return;
      const front = main.cur.front;
      const span = Math.min(L * 0.12, 160);
      // wave arrow: just inside the road, pointing backwards (against traffic)
      const off = -T.rw / 2 - 14;
      const arc = (from, to, offset) => {
        const n = 24; c.beginPath();
        for (let q = 0; q <= n; q++) { const p = T.at((from + (to - from) * q / n) * k, offset); if (q === 0) c.moveTo(p.x, p.y); else c.lineTo(p.x, p.y); }
        c.stroke();
        const pe = T.at(to * k, offset), pb = T.at((to - (to - from) * 0.08) * k, offset);
        const a = Math.atan2(pe.y - pb.y, pe.x - pb.x);
        c.beginPath();
        c.moveTo(pe.x + Math.cos(a) * 3, pe.y + Math.sin(a) * 3);
        c.lineTo(pe.x - Math.cos(a - 0.5) * 9, pe.y - Math.sin(a - 0.5) * 9);
        c.lineTo(pe.x - Math.cos(a + 0.5) * 9, pe.y - Math.sin(a + 0.5) * 9);
        c.closePath(); c.fill();
      };
      c.lineWidth = 3; c.lineCap = 'round';
      c.strokeStyle = C.wave; c.fillStyle = C.wave;
      arc(front, front - span, off);
      const lw = T.at((front - span * 0.5) * k, off - 16);
      label(c, '拥堵波 ' + Math.round(w * KMH) + ' km/h', lw.x, lw.y, { size: 11, bg: C.surface, color: C.wave, ring: C.wave });
      // car arrow: outside the road, pointing forwards
      let vs = 0, n = 0;
      for (let i = 0; i < sim.N; i++) { vs += sim.V[i]; n++; }
      const vm = vs / n;
      c.strokeStyle = C.carflow; c.fillStyle = C.carflow;
      arc(front - span, front, T.rw / 2 + 12);
      let clash = false;
      if (this.selectedPos != null) { let d = Math.abs(this.selectedPos - (front - span * 0.5)) % L; d = Math.min(d, L - d); clash = d < span * 0.5 + 40; }
      const lc = T.at((front - span * 0.5) * k, T.rw / 2 + (clash ? 48 : 30));
      label(c, '汽车 +' + Math.round(vm * KMH) + ' km/h', lc.x, lc.y, { size: 11, bg: C.surface, color: C.carflow, ring: C.carflow });
      c.lineCap = 'butt';
    }

    hit(x, y) {
      let best = null, bd = 28 * 28;
      for (let i = 0; i < this.carXY.length; i++) {
        const p = this.carXY[i]; if (!p) continue;
        const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
        if (d < bd) { bd = d; best = i; }
      }
      return best;
    }
  }

  /* ---------- platoon close-up: the tracked cars on a straight strip ---------- */
  class StripView {
    constructor(canvas) { this.box = new CanvasBox(canvas); this.scale = null; this.center = null; }
    draw(lab, ui) {
      this.box.fit();
      const c = this.box.begin(), W = this.box.w, H = this.box.h, sim = lab.sim;
      const cars = lab.platoonCars;
      if (!cars.length) return;
      const lead = sim.leaderOf(cars[0]);
      const list = [lead].concat(cars);               // downstream first
      // positions relative to the last car, measured along the road (no wrap issues)
      const rel = new Array(list.length);
      rel[list.length - 1] = 0;
      for (let q = list.length - 2; q >= 0; q--) rel[q] = rel[q + 1] + sim.gap(list[q + 1]) + sim.p.len;
      const span = rel[0] + sim.p.len;
      const pad = 26;
      const target = Math.min(9, (W - 2 * pad) / Math.max(span, 30));
      this.scale = this.scale === null ? target : this.scale + (target - this.scale) * 0.15;
      const sc = this.scale;
      const lenPx = Math.max(10, sim.p.len * sc);
      const x0 = (W - (rel[0] * sc + lenPx)) / 2;          // rear of the last car; group centred
      const front = q => x0 + rel[q] * sc + lenPx;
      const yRoad = 44, rh = 18;
      c.fillStyle = C.road; c.fillRect(0, yRoad - rh / 2, W, rh);
      c.fillStyle = C.roadEdge; c.fillRect(0, yRoad - rh / 2 - 1.5, W, 1.5); c.fillRect(0, yRoad + rh / 2, W, 1.5);
      c.fillStyle = C.muted; c.font = '500 10px ' + FONT; c.textBaseline = 'middle'; c.textAlign = 'left';
      c.fillText('车队特写　车上方：编号　下方：速度 km/h　路面：车距', 8, 9);
      c.textAlign = 'right'; c.fillText('行驶方向 →', W - 8, 9);
      const vEq = lab.vEq();
      for (let q = 0; q < list.length; q++) {
        const i = list[q];
        const xr = front(q);                               // front bumper
        const cls = An.classify(sim.V[i], vEq);
        c.fillStyle = C.state[cls];
        c.globalAlpha = q === 0 ? 0.55 : 1;
        roundRect(c, xr - lenPx, yRoad - 5, lenPx, 10, 3); c.fill();
        c.globalAlpha = 1;
        if (q > 0) { c.strokeStyle = C.series[(q - 1) % 6]; c.lineWidth = 2; roundRect(c, xr - lenPx - 2, yRoad - 7, lenPx + 4, 14, 4); c.stroke(); }
        if (sim.Aeff[i] < -0.8 && sim.V[i] > 0.3) { c.fillStyle = C.brake; c.beginPath(); c.arc(xr - lenPx - 1, yRoad, 2.6, 0, TAU); c.fill(); }
        c.font = '650 10.5px ' + FONT_NUM; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = q === 0 ? C.muted : C.ink;
        c.fillText((q === 0 ? '前车 ' : '') + '#' + (i + 1), xr - lenPx / 2, 25);
        c.fillStyle = C.ink2; c.font = '500 10px ' + FONT_NUM;
        c.fillText(Math.round(sim.V[i] * KMH) + '', xr - lenPx / 2, 64);
        if (q > 0) {
          const g = sim.gap(i);
          const gpx = (front(q - 1) - lenPx) - xr;          // drawn space up to the car in front
          if (gpx > 34) {
            c.fillStyle = C.roadEdge; c.font = '600 9.5px ' + FONT_NUM;
            c.fillText(g.toFixed(g < 10 ? 1 : 0) + ' m', xr + gpx / 2, yRoad + 0.5);
          }
        }
      }
    }
  }

  /* ---------- nice axis ticks ---------- */
  function niceStep(range, target) {
    const raw = range / Math.max(1, target);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / mag;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  }

  /* ---------- platoon time series (speed / acceleration / gap) ---------- */
  class SeriesChart {
    constructor(canvas, tipEl) {
      this.box = new CanvasBox(canvas); this.tip = tipEl; this.kind = 'speed'; this.window = 60;
      this.cross = null; this.crossHold = 0;
      const onMove = e => {
        const r = canvas.getBoundingClientRect();
        this.cross = { x: e.clientX - r.left, y: e.clientY - r.top };
        this.crossHold = performance.now() + 2600;
        this.dirty = true;
      };
      canvas.addEventListener('pointerdown', e => { onMove(e); });
      canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) onMove(e); });
      canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { this.cross = null; this.tip.hidden = true; this.dirty = true; } });
    }
    draw(lab) {
      this.box.fit();
      const c = this.box.begin(), W = this.box.w, H = this.box.h;
      const ring = lab.series, n = ring.count, cars = lab.platoonCars;
      const col = this.kind === 'speed' ? 0 : this.kind === 'accel' ? 1 : 2;
      const conv = this.kind === 'speed' ? KMH : 1;
      const padL = 40, padR = 12, padT = 10, padB = 24;
      const pw = W - padL - padR, ph = H - padT - padB;
      const tEnd = n ? ring.time(n - 1) : lab.t;
      const tStart = Math.max(0, tEnd - this.window);
      let k0 = 0; while (k0 < n - 1 && ring.time(k0) < tStart) k0++;
      // y range
      let lo = Infinity, hi = -Infinity;
      for (let k = k0; k < n; k++) for (let q = 0; q < cars.length; q++) {
        const v = ring.get(k, 3 * q + col) * conv; if (v < lo) lo = v; if (v > hi) hi = v;
      }
      if (!isFinite(lo)) { lo = 0; hi = 1; }
      if (this.kind === 'speed') {
        const pad = Math.max(4, (hi - lo) * 0.12);
        lo = Math.max(0, lo - pad); hi = hi + pad;
        if (hi - lo < 12) { const m = (hi + lo) / 2; lo = Math.max(0, m - 6); hi = lo + 12; }
      }
      else if (this.kind === 'accel') { const m = Math.max(1.5, Math.abs(lo), Math.abs(hi)) * 1.1; lo = -m; hi = m; }
      else { lo = 0; hi = Math.max(hi * 1.1, 10); }
      const X = t => padL + (t - tStart) / Math.max(1e-9, (tEnd - tStart) || this.window) * pw;
      const Y = v => padT + (1 - (v - lo) / (hi - lo)) * ph;
      // grid + axes
      c.font = '500 10px ' + FONT_NUM; c.fillStyle = C.muted; c.textAlign = 'right'; c.textBaseline = 'middle';
      const ys = niceStep(hi - lo, 4);
      c.strokeStyle = C.grid; c.lineWidth = 1;
      for (let v = Math.ceil(lo / ys) * ys; v <= hi + 1e-9; v += ys) {
        const y = Math.round(Y(v)) + 0.5;
        c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke();
        c.fillText((Math.abs(v) < 1e-9 ? 0 : +v.toFixed(2)) + '', padL - 6, y);
      }
      if (this.kind === 'accel') { c.strokeStyle = C.axis; const y = Math.round(Y(0)) + 0.5; c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke(); }
      c.textAlign = 'center'; c.textBaseline = 'top';
      const span = Math.max(tEnd - tStart, 1);
      const xs = niceStep(span, 5);
      for (let t = Math.ceil(tStart / xs) * xs; t <= tEnd + 1e-9; t += xs) {
        const x = X(t); if (x < padL - 1) continue;
        c.fillStyle = C.muted; c.fillText(Math.round(t) + ' s', x, H - padB + 6);
        c.strokeStyle = C.grid; c.beginPath(); c.moveTo(Math.round(x) + 0.5, padT); c.lineTo(Math.round(x) + 0.5, padT + ph); c.stroke();
      }
      c.strokeStyle = C.axis; c.beginPath(); c.moveTo(padL, padT + ph + 0.5); c.lineTo(W - padR, padT + ph + 0.5); c.stroke();
      // disturbance marker
      const lp = lab.lastPerturb;
      if (lp && lp.t >= tStart && lp.t <= tEnd) {
        const x = Math.round(X(lp.t)) + 0.5;
        c.strokeStyle = C.alert; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x, padT); c.lineTo(x, padT + ph); c.stroke();
        c.fillStyle = C.alert; c.font = '600 10px ' + FONT; c.textAlign = 'left'; c.textBaseline = 'top';
        c.fillText('扰动', x + 3, padT + 1);
      }
      if (n < 2) return;
      // lines (back to front so the disturbed car is on top)
      c.lineJoin = 'round'; c.lineCap = 'round';
      for (let q = cars.length - 1; q >= 0; q--) {
        c.strokeStyle = C.series[q % 6]; c.lineWidth = q === 0 ? 2.4 : 2;
        c.beginPath();
        for (let k = k0; k < n; k++) {
          const x = X(ring.time(k)), y = Y(ring.get(k, 3 * q + col) * conv);
          if (k === k0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.stroke();
      }
      // minimum markers for the speed view (from the platoon record: real minima)
      const pl = lab.platoon;
      if (this.kind === 'speed' && pl.active && pl.cause === 'disturbance') {
        for (let q = 0; q < pl.cars.length && q < cars.length; q++) {
          const cr = pl.cars[q];
          if (cr.baseline - cr.vMin < 0.5 || cr.vMinT < tStart) continue;
          const x = X(cr.vMinT), y = Y(cr.vMin * KMH);
          c.fillStyle = C.surface; c.beginPath(); c.arc(x, y, 5.5, 0, TAU); c.fill();
          c.fillStyle = C.series[q % 6]; c.beginPath(); c.arc(x, y, 3.8, 0, TAU); c.fill();
        }
        // label the deepest dip only
        let deep = -1, dv = 0;
        pl.cars.forEach((cr, q) => { const d = cr.baseline - cr.vMin; if (d > dv && cr.vMinT >= tStart) { dv = d; deep = q; } });
        if (deep >= 0 && dv > 0.5) {
          const cr = pl.cars[deep];
          const x = X(cr.vMinT), y = Y(cr.vMin * KMH);
          label(c, '#' + (cr.idx + 1) + ' 最低 ' + Math.round(cr.vMin * KMH), Math.min(Math.max(x, padL + 50), W - 50), Math.min(y + 16, padT + ph - 8), { size: 10, bg: C.surface, color: C.ink, ring: C.line });
        }
      }
      // crosshair + tooltip (touch: shown for a moment after the finger lifts)
      if (this.cross && (performance.now() < this.crossHold || !this.liveRunning)) {
        const t = tStart + (this.cross.x - padL) / pw * (tEnd - tStart);
        let kb = k0, bd = Infinity;
        for (let k = k0; k < n; k++) { const d = Math.abs(ring.time(k) - t); if (d < bd) { bd = d; kb = k; } }
        const x = Math.round(X(ring.time(kb))) + 0.5;
        if (x >= padL && x <= W - padR) {
          c.strokeStyle = C.ink2; c.lineWidth = 1; c.beginPath(); c.moveTo(x, padT); c.lineTo(x, padT + ph); c.stroke();
          const unit = this.kind === 'speed' ? ' km/h' : this.kind === 'accel' ? ' m/s²' : ' m';
          const dec = this.kind === 'accel' ? 2 : this.kind === 'gap' ? 1 : 0;
          let html = '<div class="t">t = ' + ring.time(kb).toFixed(1) + ' s</div>';
          for (let q = 0; q < cars.length; q++) {
            const v = ring.get(kb, 3 * q + col) * conv;
            html += '<div class="row"><i style="background:' + C.series[q % 6] + '"></i><b>' + v.toFixed(dec) + unit + '</b><span>#' + (cars[q] + 1) + (q === 0 ? ' 扰动车' : '') + '</span></div>';
            c.fillStyle = C.series[q % 6]; c.beginPath(); c.arc(x, Y(v), 3, 0, TAU); c.fill();
          }
          this.tip.innerHTML = html;
          this.tip.hidden = false;
          this.tip.style.left = (x > W / 2 ? Math.max(4, x - 12 - this.tip.offsetWidth) : x + 12) + 'px';
        } else this.tip.hidden = true;
      } else if (!this.tip.hidden) this.tip.hidden = true;
    }
  }

  /* ---------- space-time diagram ---------- */
  function stClassPaths(c, getPos, getV, nS, N, L, X, Y, vEqAt, widths, alphaFree) {
    const paths = [new Path2D(), new Path2D(), new Path2D()];
    for (let i = 0; i < N; i++) {
      let px = null, py = null, pp = null;
      for (let s = 0; s < nS; s++) {
        const pos = getPos(s, i), v = getV(s, i);
        const x = X(s), y = Y(pos);
        if (pp !== null && Math.abs(pos - pp) < L / 2) {
          const cls = An.classify(v, vEqAt(s));
          paths[cls].moveTo(px, py); paths[cls].lineTo(x, y);
        }
        px = x; py = y; pp = pos;
      }
    }
    c.lineCap = 'round';
    for (let cls = 0; cls < 3; cls++) {
      c.strokeStyle = C.state[cls]; c.lineWidth = widths[cls];
      c.globalAlpha = cls === 0 ? alphaFree : 1;
      c.stroke(paths[cls]);
    }
    c.globalAlpha = 1;
  }

  class SpaceTimeChart {
    constructor(canvas, tipEl) {
      this.box = new CanvasBox(canvas); this.tip = tipEl; this.window = 240; this.tap = null; this.tapHold = 0;
      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        this.tap = { x: e.clientX - r.left, y: e.clientY - r.top }; this.tapHold = performance.now() + 3500; this.dirty = true;
      });
    }
    draw(lab, ui) {
      this.box.fit();
      const c = this.box.begin(), W = this.box.w, H = this.box.h, st = lab.st, n = st.count, sim = lab.sim, L = sim.L, N = sim.N;
      const padL = 44, padR = 12, padT = 10, padB = 24;
      const pw = W - padL - padR, ph = H - padT - padB;
      const tEnd = n ? st.time(n - 1) : 0;
      const tStart = Math.max(0, tEnd - this.window);
      let s0 = 0; while (s0 < n - 1 && st.time(s0) < tStart) s0++;
      const span = Math.max(tEnd - tStart, 30);
      const Xt = t => padL + (t - tStart) / span * pw;
      const Y = p => padT + (1 - p / L) * ph;
      // axes
      c.font = '500 10px ' + FONT_NUM; c.fillStyle = C.muted; c.textAlign = 'right'; c.textBaseline = 'middle';
      const ystep = L >= 2000 ? 500 : 250;
      c.strokeStyle = C.grid; c.lineWidth = 1;
      for (let p = 0; p <= L + 1e-9; p += ystep) {
        const y = Math.round(Y(p)) + 0.5;
        c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke();
        c.fillText(p + (p === 0 ? ' m' : ''), padL - 6, y);
      }
      c.textAlign = 'center'; c.textBaseline = 'top';
      const xs = niceStep(span, 5);
      for (let t = Math.ceil(tStart / xs) * xs; t <= tStart + span + 1e-9; t += xs) {
        const x = Xt(t); c.fillText(Math.round(t) + ' s', x, H - padB + 6);
      }
      if (n < 2) return;
      const mc = lab.metrics;
      const vEqNow = lab.vEq();
      // vEq at each sample: the metrics ring is sampled together with st
      const vEqAt = () => vEqNow;
      c.save();

/* =====================================================================

 *     (with a Doppler-like drop in pitch) each time a car passes a roadside
 *     microphone at the start line (0 m)
 *   - distant car horns that come and go while there is a jam; the bigger the

        if (this.clearHold >= HOLD_OFF) { this.mode = 'flow'; this.clearHold = 0; }
      } else {

        if (this.jamHold >= HOLD_ON) { this.mode = 'jam'; this.jamHold = 0; }

        horns: this.mode === 'jam' ? curve(settings.horns) : 0,

  /* ---------------- events from the model → short notes on the stage ---------------- */

    if (ev.type === 'jamFormed' || ev.type === 'firstStop') ui.done.add('jam:' + pk);
    if (!ui.tips) return;
    const car = i => '车 #' + (i + 1);
    switch (ev.type) {
      case 'perturb': toast(car(ev.car) + ' 开始刹车：' + ev.decel.toFixed(1) + ' m/s²，持续 ' + ev.dur.toFixed(1) + ' 秒。', 'info'); break;
      case 'amplified': toast('后车刹得更深了：' + car(ev.car) + ' 降速 ' + Math.round(ev.dip * KMH) + ' km/h，比它前面的 ' + car(ev.leader) + '（' + Math.round(ev.prevDip * KMH) + ' km/h）还多。', 'warn'); break;
      case 'firstStop': toast(car(ev.car) + ' 完全停下了——走走停停开始了。', 'jam'); break;
      case 'jamFormed': toast('拥堵区形成：' + ev.n + ' 辆车严重拥堵，而路上没有任何障碍。', 'jam'); break;
      case 'wave': toast('拥堵区正以约 ' + Math.abs(Math.round(ev.speed * KMH)) + ' km/h 向后移动，车辆却都在向前开。', 'jam'); break;

      case 'decayed': toast('扰动已消散：' + Math.round(ev.after) + ' 秒后所有车恢复匀速。', 'good'); break;
      case 'constraint': toast('险情：' + (ev.car !== null ? car(ev.car) : '一辆车') + ' 与前车距离不足 0.5 米，安全约束介入（现实中可能就是追尾）。', 'jam'); break;

  const toastBox = $('#toasts');

  /* ---------------- layout: place panels into docks ---------------- */
  const PANELS = { teach: $('#panelTeach'), charts: $('#panelCharts'), params: $('#panelParams'), car: $('#panelCar') };
  const DOCKS = { A: $('#dockA'), B: $('#dockB'), C: $('#dockC') };
  const PLAN = {
    'phone-portrait': { A: ['teach', 'charts', 'params', 'car'] },
    'phone-landscape': { A: ['teach', 'charts', 'params', 'car'] },
    'tablet-portrait': { A: ['params', 'car'], B: ['charts'], C: ['teach'] },
    'tablet-landscape': { A: ['params', 'car'], B: ['charts'], C: ['teach'] }
  };
  function computeLayout() {
    const w = app.clientWidth || window.innerWidth, h = app.clientHeight || window.innerHeight;
    if (h < 520 && w > h) return 'phone-landscape';
    if (w < 740) return 'phone-portrait';
    if (w >= 1000 && h >= 520 && w > h * 1.05) return 'tablet-landscape';

  function applyLayout(force) {

    for (const d of ['A', 'B', 'C']) {
      const dock = DOCKS[d], body = dock.querySelector('.dock-body'), tabs = dock.querySelector('.dock-tabs');
      const names = plan[d] || [];
      tabs.innerHTML = '';
      if (!names.length) { dock.setAttribute('data-empty', ''); continue; }
      dock.removeAttribute('data-empty');
      if (names.length === 1) dock.setAttribute('data-single', ''); else dock.removeAttribute('data-single');
      if (names.indexOf(ui.dockActive[d]) < 0) ui.dockActive[d] = names[0];
      for (const n of names) {
        body.appendChild(PANELS[n]);
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.panel = n; b.id = 'tab-' + n;
        b.textContent = PANELS[n].dataset.title;
        b.addEventListener('click', () => { if (ui.dockActive[d] === n && L === 'phone-portrait') cycleSheet(1, true); showPanel(n); });
        tabs.appendChild(b);

        '<td>' + (rec ? ((rec.baseline - rec.vMin) * KMH).toFixed(0) + ' km/h' : '—') + '</td><td>' + (rec && rec.recoverT !== null ? (rec.recoverT - rec.vMinT).toFixed(1) + ' s' : '—') + '</td></tr>';

  function updateTeach(force) {
    if (ui.chapter === 'quiz') { updateQuizScore(); return; }
    const ch = Ct.CHAPTERS[ui.chapter];
    const out = ch.live(lab, ui);
    for (const k in out) {
      const el = teachRefs.live[k];
      if (el && (force || el._html !== out[k])) { el.innerHTML = out[k]; el._html = out[k]; el.classList.toggle('empty', !out[k]); }
    }
    let next = false;
    teachRefs.steps.forEach((li, k) => {
      const done = !!ch.steps[k].done(lab, ui);

      li.classList.toggle('next', !done && !next);
      if (!done) next = true;
    });
    if (ui.chapter === 'exp3' && ui.selected !== null) {
      const ev = lab.states.journey(ui.selected, ui.followSince || 0);
      if (ev.some(e => e.to === 2) && ev.some(e => e.from === 2)) ui.done.add('journey');

  /* ---------------- challenge ---------------- */
  function renderQuiz() {
    const P = PANELS.teach;
    let h = '<div class="chap-head"><span class="chap-tag">挑战</span><h2>检验你的理解</h2><p class="chap-goal">先选出你的预测，再用模型真实地运行实验来验证。每个实验在后台计算 10–15 分钟的交通（需要一两秒）。可以反复尝试。</p></div>';
    h += '<div class="score" id="quizScore"></div><div class="quiz-list">';
    Ct.QUIZ.forEach((q, n) => {
      const st = ui.quiz[q.id] || {};
      h += '<section class="quiz' + (st.results ? ' solved' : '') + '" data-q="' + q.id + '"><h3><span class="qn">' + (n + 1) + '</span><span>' + q.q + '</span></h3><div class="opts">';
      for (const [k, t] of q.options) {
        const cls = st.results ? (k === q.answer ? ' correct' : (st.choice === k ? ' wrong' : '')) : '';
        h += '<label class="opt' + cls + '"><input type="radio" name="' + q.id + '" value="' + k + '"' + (st.choice === k ? ' checked' : '') + '><span><b>' + k + '.</b> ' + t + '</span></label>';
      }
      h += '</div><div class="quiz-actions"><button type="button" class="btn" data-act="quizrun:' + q.id + '"' + (st.choice ? '' : ' disabled') + '>' + (st.results ? '重新运行实验' : '提交预测，运行实验') + '</button><span class="busy" hidden>正在计算…</span></div>';
      h += '<div class="result" ' + (st.results ? '' : 'hidden') + '></div></section>';
    });
    h += '</div>';
    P.innerHTML = h;
    P.querySelectorAll('.quiz input[type=radio]').forEach(r => r.addEventListener('change', () => {
      const qid = r.name; ui.quiz[qid] = Object.assign(ui.quiz[qid] || {}, { choice: r.value });
      const b = P.querySelector('[data-act="quizrun:' + qid + '"]'); if (b) b.disabled = false;
    }));
    Ct.QUIZ.forEach(q => { if (ui.quiz[q.id] && ui.quiz[q.id].results) showQuizResult(q); });
    updateQuizScore();
  }
  function updateQuizScore() {
    const el = $('#quizScore'); if (!el) return;
    let done = 0, right = 0;
    for (const q of Ct.QUIZ) { const st = ui.quiz[q.id]; if (st && st.results) { done++; if (st.firstChoice === q.answer) right++; } }
    el.textContent = done ? '已完成 ' + done + ' / ' + Ct.QUIZ.length + ' 题，首次预测正确 ' + right + ' 题。' : '共 ' + Ct.QUIZ.length + ' 题。每题都没有“背答案”的捷径：结果由模型现场计算。';
  }
  async function runQuiz(qid) {
    const q = Ct.QUIZ.find(x => x.id === qid), st = ui.quiz[qid];
    if (!q || !st || !st.choice) return;
    const sec = document.querySelector('.quiz[data-q="' + qid + '"]');
    const btnRun = sec.querySelector('[data-act^="quizrun"]'), busy = sec.querySelector('.busy');
    btnRun.disabled = true; busy.hidden = false;
    const results = [];
    for (let n = 0; n < q.runs.length; n++) {
      const run = q.runs[n];
      const opt = Object.assign({}, q.opt || {}, run.opt || {});
      results.push(await Pr.runScenarioAsync(run.params(), opt, f => { busy.textContent = '正在计算 ' + (n + 1) + '/' + q.runs.length + '（' + Math.round(f * 100) + '%）'; }));
    }
    if (!st.firstChoice) st.firstChoice = st.choice;
    st.results = results;
    busy.hidden = true; btnRun.disabled = false; btnRun.textContent = '重新运行实验';
    sec.classList.add('solved');
    sec.querySelectorAll('.opt').forEach(o => {
      const v = o.querySelector('input').value;
      o.classList.toggle('correct', v === q.answer);
      o.classList.toggle('wrong', v === st.choice && v !== q.answer);
    });
    showQuizResult(q);
    updateQuizScore();
  }
  function showQuizResult(q) {
    const st = ui.quiz[q.id], sec = document.querySelector('.quiz[data-q="' + q.id + '"]');
    if (!sec || !st.results) return;
    const box = sec.querySelector('.result');
    const ok = st.choice === q.answer;
    let h = '<p>' + (ok ? '<span class="verdict good">你的预测得到了模拟结果的支持</span>' : '<span class="verdict bad">模拟结果与你的预测不同</span>') + ' 参考答案：<b>' + q.answer + '</b></p>';
    h += '<div class="minis">';
    st.results.forEach((r, k) => {
      h += '<div class="mini"><h5>' + q.runs[k].label + '</h5><canvas data-mini="' + k + '" aria-label="时空图缩略图"></canvas><div class="stats">' + Ct.fmtRun(r) + '</div>' +
        '<button type="button" class="btn small soft" data-act="watch:' + q.id + ':' + k + '">在主模拟中观看</button></div>';
    });
    h += '</div><p class="hint">小图是时空图：横轴是时间（0–' + Math.round(st.results[0].st.times[st.results[0].st.n - 1]) + ' 秒），纵轴是道路位置；红色表示严重拥堵。</p>';
    h += q.explain(st.results);
    box.innerHTML = h; box.hidden = false;
    box.querySelectorAll('canvas[data-mini]').forEach(cv => Vw.drawMini(cv, st.results[+cv.dataset.mini]));
  }

  /* ---------------- actions from buttons inside panels ---------------- */
  function parseKV(s) { const [k, v] = s.split('='); return { [k]: +v }; }
  function act(a) {
    const [cmd, arg, arg2] = a.split(':');
    switch (cmd) {
      case 'preset': loadPreset(arg); break;
      case 'preset+pert': loadPreset(arg, null, { perturb: true }); break;
      case 'perturb': doPerturb(); break;
      case 'ff': fastForward(+arg); break;
      case 'chart': setChart(arg); showPanel('charts'); break;
      case 'tab': showPanel(arg); break;
      case 'slowmo': ui.slow = true; ui.done.add('slowmo'); if (!ui.started) start(); markAll(); break;
      case 'set+pert': { const kv = parseKV(arg); loadPreset(ui.basePreset, kv, { perturb: true, keepSpeed: true }); ui.done.add('pert:' + Object.keys(kv)[0] + kv[Object.keys(kv)[0]]); break; }
      case 'setff': loadPreset(ui.basePreset, parseKV(arg), { perturb: true, ff: 150, keepSpeed: true }); break;
      case 'crit': loadPreset('critical', arg === 'strong' ? { pertDecel: 6, pertDur: 6 } : null, { perturb: true }); break;
      case 'noise': loadPreset(arg, { noise: 0.2 }, { run: true }); break;
      case 'focus': ui.focusK = +arg; renderFocusChips(); updateTeach(true); break;
      case 'pickApproach': pickApproach(); break;
      case 'wave': views.ring.showWave = true; $('#optWave').checked = true; markAll(); break;
      case 'chapter': switchChapter(arg); break;
      case 'select': select(+arg); break;
      case 'perturbSel': doPerturb(); break;
      case 'headSel': if (ui.selected !== null) { lab.setPlatoonHead(ui.selected); renderFocusChips(); renderChartLegend(); markAll(); } break;
      case 'unselect': select(null); break;
      case 'quizrun': runQuiz(arg); break;
      case 'watch': {
        const q = Ct.QUIZ.find(x => x.id === arg), run = q.runs[+arg2];
        const params = run.params(), opt = Object.assign({}, q.opt || {}, run.opt || {});
        newLab(params); ui.presetKey = 'custom'; ui.basePreset = 'phantom'; ui.selected = null; ui.running = false; ui.started = false;
        if (opt.perturb) { lab.sim.p.pertDecel = opt.perturb.decel; lab.sim.p.pertDur = opt.perturb.dur; }
        syncParamsPanel(); syncPresetButtons(); $('#hudPreset').textContent = run.label;
        start(); doPerturb(); ui.speed = 8; markAll();
        toast('已载入「' + run.label + '」，以 8 倍速运行。', 'info');
        break;
      }
    }
